<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#1B2A4A"/>
<title>PORTABOOM PB4000 Incredible QR PREVIEW</title>
<style>
:root{--soft:#F4F6F9;--paper:#fff;--navy:#1B2A4A;--orange:#EE7202;--ink:#202020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--soft);color:var(--ink);font:15px/1.35 system-ui,-apple-system,sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{padding:calc(10px + env(safe-area-inset-top)) 16px 8px;background:var(--navy);color:#fff}
header b{color:var(--orange)}
header p{margin:4px 0 0;opacity:.85;font-size:13px}
#c{flex:1;touch-action:none;background:radial-gradient(ellipse at 50% 40%,#2b3c5e 0%,var(--navy) 70%)}
#hud{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(16,27,48,.92));color:#fff}
#hud strong{color:var(--orange)}
.pill{display:inline-block;margin-top:8px;padding:10px 16px;border-radius:12px;background:var(--orange);color:#fff;font-weight:700;text-decoration:none}
.badge{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;background:rgba(238,114,2,.95);color:#fff;font:700 11px/1 system-ui;padding:6px 10px;border-radius:999px;z-index:2}
</style>
</head>
<body>
<div id="app">
<div class="badge">PREVIEW</div>
<header><div><b>PORTABOOM</b> PB4000 · Incredible QR</div><p id="mode">Idle · boom breathes on the module grid · tap to flatten</p></header>
<canvas id="c"></canvas>
<div id="hud"><div id="hint">Tap the boom to <strong>flatten</strong> into a scan-proof QR (error H).</div>
<a class="pill" href="https://www.trafficaccess.com.au/portaboom-product/portaboom-pb4000-series/" target="_blank" rel="noopener">Open product page</a></div>
</div>
