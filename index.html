<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1B2A4A">
<meta name="robots" content="noindex,nofollow">
<title>PREVIEW · PORTABOOM® Incredible QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --soft:#0B1424; --paper:#FFFFFF; --ink:#F4F6F9; --ink-soft:#C5CAD3;
  --line:rgba(255,255,255,.14); --navy:#1B2A4A; --navy-deep:#081018;
  --orange:#EE7202; --orange-h:#FF8420;
  --sans:"Inter",-apple-system,system-ui,sans-serif;
  --serif:"Fraunces",Georgia,serif; --mono:"JetBrains Mono",Menlo,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--soft);overflow:hidden;font-family:var(--sans)}
canvas#stage{position:fixed;inset:0;width:100%;height:100dvh;display:block;touch-action:none;background:radial-gradient(ellipse at 50% 36%,#1B2A4A 0%,#101B30 48%,#0B1424 100%)}
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(var(--sat)+12px) calc(var(--sar)+12px) calc(var(--sab)+12px) calc(var(--sal)+12px);display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;border-radius:999px;padding:8px 12px;font:800 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.brand{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:999px;padding:6px 12px 6px 6px;text-decoration:none;max-width:min(58vw,260px)}
.brand img{height:26px;background:#fff;border-radius:999px;padding:3px 7px}
.brand span{font:700 12px/1 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock{pointer-events:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;width:100%}
.btn{appearance:none;border:0;border-radius:999px;padding:12px 16px;font:700 13px/1 var(--sans);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.btn.primary{background:var(--orange);color:#fff}
.btn.ghost{background:rgba(255,255,255,.92);color:var(--navy);border:1px solid var(--line)}
#status{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sat)+56px);pointer-events:none;font:700 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--orange);background:rgba(8,16,24,.78);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:8px 12px;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#aspect{position:fixed;right:12px;top:calc(var(--sat)+56px);pointer-events:none;font:800 11px/1 var(--sans);letter-spacing:.12em;border-radius:999px;padding:8px 10px;color:#081018;background:#18ff5a}
#aspect[data-aspect="amber"]{background:#ffb000}
#aspect[data-aspect="red"]{background:#ff1d12;color:#fff}
#aspect[data-aspect="green"]{background:#18ff5a}
#stage:not([data-iqr-ready]){background:
  radial-gradient(ellipse at 50% 38%,#1B2A4A 0%,#101B30 52%,#0B1424 100%),
  repeating-linear-gradient(90deg,rgba(238,114,2,.08) 0 10px,transparent 10px 22px),
  repeating-linear-gradient(0deg,rgba(238,114,2,.05) 0 10px,transparent 10px 22px)}
#fail{display:none;position:fixed;inset:0;place-items:center;background:var(--soft);color:#fff;padding:28px;text-align:center}
#fail.show{display:grid}
</style>
</head>
<body>
<canvas id="stage" aria-label="PORTABOOM PB4000 Incredible QR preview"></canvas>
<div id="status">PORTABOOM on QR grid…</div>
<div id="aspect" data-aspect="green">GREEN</div>
<div id="hud">
  <div class="row">
    <div class="badge">Preview</div>
    <a class="brand" href="https://www.trafficaccess.com.au/portaboom-product/portaboom-pb4000-series/" target="_blank" rel="noopener">
      <img src="./portaboom_logo.png" alt="PORTABOOM"><span>PB4000</span>
    </a>
  </div>
  <div class="dock">
    <button class="btn primary" id="boomBtn" type="button">Raise / lower boom</button>
    <button class="btn ghost" id="flattenBtn" type="button">Flatten to QR</button>
    <a class="btn ghost" href="./portaboom-pb4000-master.png" download="PORTABOOM-PB4000-master-QR.png">Download print QR</a>
  </div>
</div>
<div id="fail"><div><h2>WebGL unavailable</h2><p>Open on a phone or laptop with WebGL.</p></div></div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
<script type="module" src="./app.js?v=front1"></script>
</body>
</html>
