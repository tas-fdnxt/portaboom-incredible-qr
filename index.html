<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#1B2A4A"/>
<title>PORTABOOM® PB4000 · Incredible QR PREVIEW</title>
<style>
:root{--soft:#F4F6F9;--paper:#fff;--navy:#1B2A4A;--orange:#EE7202;--ink:#202020;--ink-soft:#5B6573}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--navy);color:#fff;font:15px/1.35 Inter,system-ui,-apple-system,sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{z-index:2;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(180deg,rgba(27,42,74,.96),rgba(27,42,74,.55) 70%,transparent)}
header .brand{font-weight:800;letter-spacing:.02em}
header .brand b{color:var(--orange)}
header p{margin:4px 0 0;color:rgba(255,255,255,.82);font-size:13px}
#c{flex:1;width:100%;touch-action:none}
#hud{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:14px 16px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(16,27,48,.94));pointer-events:none}
#hud a,#hud button{pointer-events:auto}
#hint{margin:0 0 10px;color:rgba(255,255,255,.9)}
#hint strong{color:var(--orange)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;padding:11px 16px;border-radius:12px;background:var(--orange);color:#fff;font-weight:700;text-decoration:none;border:0;font:inherit}
.pill.ghost{background:rgba(255,255,255,.12);backdrop-filter:blur(8px)}
.badge{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:3;background:var(--orange);color:#fff;font:700 11px/1 system-ui;padding:7px 11px;border-radius:999px}
#status{font-size:12px;opacity:.75;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <div class="badge">PREVIEW</div>
  <header>
    <div class="brand"><b>PORTABOOM</b>® PB4000 · Incredible QR</div>
    <p id="mode">Loading golden twin…</p>
  </header>
  <canvas id="c"></canvas>
  <div id="hud">
    <p id="hint">Real PB4000 twin on a living QR grid. <strong>Tap</strong> to flatten into a scan-proof code.</p>
    <div class="row">
      <button class="pill" id="flattenBtn" type="button">Flatten to QR</button>
      <a class="pill ghost" href="https://www.trafficaccess.com.au/portaboom-product/portaboom-pb4000-series/" target="_blank" rel="noopener">Product page</a>
    </div>
    <div id="status"></div>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
