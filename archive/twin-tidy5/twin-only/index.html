<!doctype html><html><head><meta charset="utf-8"><title>PORTABOOM Unit (standalone)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>*{margin:0;box-sizing:border-box}html,body{height:100%}body{background:#0c1014;font:13px system-ui;color:#e8edf2;overflow:hidden}
#c{position:absolute;inset:0}#p{position:absolute;left:14px;top:14px;z-index:5;background:#141c24cc;border:1px solid #2a3744;border-radius:10px;padding:12px;width:180px}
#p b{font-size:13px}.btn{display:block;width:100%;margin:6px 0;padding:9px;border:0;border-radius:8px;background:#33404d;color:#cfe;font-weight:600;cursor:pointer}.btn.on{background:#EE7202;color:#1B2A4A}
.load{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9;background:#000c;padding:12px 18px;border-radius:8px}</style></head>
<body><div id="c"><div class="load" id="load">Loading PORTABOOM unit…</div></div>
<div id="p"><b>PORTABOOM unit</b><div style="color:#9fb0c0;font-size:11px;margin:4px 0 8px">standalone · no world</div>
<button class="btn" id="boom">Open boom</button><button class="btn on" id="lights">Lights: ON</button><button class="btn" id="spin">Auto-rotate</button></div>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {PortaboomUnit} from './portaboom-unit.js';
const mount=document.getElementById('c');const W=()=>mount.clientWidth,H=()=>mount.clientHeight;
const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(W(),H());
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;r.shadowMap.enabled=true;mount.appendChild(r.domElement);
const scene=new THREE.Scene();const pm=new THREE.PMREMGenerator(r);scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
const cam=new THREE.PerspectiveCamera(40,W()/H(),0.1,100);cam.position.set(3,2,5.5);
const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(4,6,4);key.castShadow=true;scene.add(key);
scene.add(new THREE.AmbientLight(0x223044,0.6));scene.add(new THREE.DirectionalLight(0xEE7202,0.9).translateX(-5));
const orbit=new OrbitControls(cam,r.domElement);orbit.enableDamping=true;orbit.target.set(0,1.1,0);orbit.autoRotate=false;orbit.autoRotateSpeed=0.9;
// contact shadow only — NO road, NO world. just the unit.
const sh=new THREE.Mesh(new THREE.CircleGeometry(2.2,40),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:0.35}));sh.rotation.x=-Math.PI/2;sh.position.y=0.001;scene.add(sh);
const pb=new PortaboomUnit({src:'pb4000_master.glb'});
pb.load().then(()=>{scene.add(pb.object);document.getElementById('load').remove();})
  .catch(e=>document.getElementById('load').textContent='Load error: '+e);
document.getElementById('boom').onclick=e=>{const o=pb.toggleBoom();e.target.textContent=o?'Close boom':'Open boom';e.target.classList.toggle('on',o);};
document.getElementById('lights').onclick=e=>{pb.lightsOn=!pb.lightsOn;pb.setLights(pb.lightsOn);e.target.textContent='Lights: '+(pb.lightsOn?'ON':'OFF');e.target.classList.toggle('on',pb.lightsOn);};
document.getElementById('spin').onclick=e=>{orbit.autoRotate=!orbit.autoRotate;e.target.classList.toggle('on',orbit.autoRotate);};
function loop(){requestAnimationFrame(loop);pb.update();orbit.update();r.render(scene,cam);}
loop();addEventListener('resize',()=>{cam.aspect=W()/H();cam.updateProjectionMatrix();r.setSize(W(),H());});
</script></body></html>
